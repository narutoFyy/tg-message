services:
  backend:
    build:
      context: ../gift-chat-server
      dockerfile: Dockerfile
    container_name: gift-chat-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://${DATA_HOST:-10.0.0.4}:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      APP_AUTH_JWT_SECRET: ${APP_AUTH_JWT_SECRET}
      APP_AUTH_STAFF_ACCESS_TOKEN_DAYS: ${APP_AUTH_STAFF_ACCESS_TOKEN_DAYS:-30}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_UPLOAD_IMAGE_DIR: /var/lib/gift-chat/uploads/images
      APP_UPLOAD_VOICE_DIR: /var/lib/gift-chat/uploads/voices
      APP_UPLOAD_VIDEO_DIR: /var/lib/gift-chat/uploads/videos
      APP_UPLOAD_PUBLIC_BASE_URL: ${APP_UPLOAD_PUBLIC_BASE_URL}
      APP_REALTIME_REDIS_ENABLED: ${APP_REALTIME_REDIS_ENABLED:-true}
      APP_REALTIME_REDIS_CHANNEL: ${APP_REALTIME_REDIS_CHANNEL:-gift-chat:realtime}
      APP_LOGIN_RATE_LIMIT_REDIS_ENABLED: ${APP_LOGIN_RATE_LIMIT_REDIS_ENABLED:-true}
      APP_WEB_PUSH_ENABLED: ${APP_WEB_PUSH_ENABLED:-false}
      APP_WEB_PUSH_PUBLIC_KEY: ${APP_WEB_PUSH_PUBLIC_KEY:-}
      APP_WEB_PUSH_PRIVATE_KEY: ${APP_WEB_PUSH_PRIVATE_KEY:-}
      APP_WEB_PUSH_SUBJECT: ${APP_WEB_PUSH_SUBJECT:-mailto:support@stonetradex.com}
      APP_WEB_PUSH_TTL_SECONDS: ${APP_WEB_PUSH_TTL_SECONDS:-300}
      APP_VIDEO_VENDOR: ${APP_VIDEO_VENDOR:-trtc}
      APP_VIDEO_TRTC_SDK_APP_ID: ${APP_VIDEO_TRTC_SDK_APP_ID:-}
      APP_VIDEO_TRTC_SECRET_KEY: ${APP_VIDEO_TRTC_SECRET_KEY:-}
      APP_VIDEO_TRTC_USER_SIG_EXPIRE_SECONDS: ${APP_VIDEO_TRTC_USER_SIG_EXPIRE_SECONDS:-604800}
      APP_TENCENT_CHAT_ENABLED: ${APP_TENCENT_CHAT_ENABLED:-false}
      APP_TENCENT_CHAT_SDK_APP_ID: ${APP_TENCENT_CHAT_SDK_APP_ID:-}
      APP_TENCENT_CHAT_SECRET_KEY: ${APP_TENCENT_CHAT_SECRET_KEY:-}
      APP_TENCENT_CHAT_ADMIN_IDENTIFIER: ${APP_TENCENT_CHAT_ADMIN_IDENTIFIER:-administrator}
      APP_TENCENT_CHAT_ADMIN_USER_SIG: ${APP_TENCENT_CHAT_ADMIN_USER_SIG:-}
      SPRING_DATA_REDIS_HOST: ${DATA_HOST:-10.0.0.4}
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - /srv/xcard-uploads:/var/lib/gift-chat/uploads
    expose:
      - "8081"

  frontend:
    build:
      context: ..
      dockerfile: gift-chat-uni/Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_WS_BASE_URL: /ws
    container_name: gift-chat-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
