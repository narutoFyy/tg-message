spring:
  datasource:
    url: jdbc:h2:mem:giftchat;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      data-locations: classpath:data-dev.sql

app:
  auth:
    jwt-secret: ${APP_AUTH_JWT_SECRET:dev-only-local-jwt-secret-please-do-not-use-in-production}
    staff-access-token-days: ${APP_AUTH_STAFF_ACCESS_TOKEN_DAYS:30}
    demo-fallback: true
